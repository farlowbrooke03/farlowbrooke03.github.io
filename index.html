<script>
    const eyes = document.querySelectorAll(".lefteye, .righteye");

    document.addEventListener("mousemove", function(event) {
        if (window.innerWidth <= 768) return;

        eyes.forEach(function(eye) {
            const pupil = eye.querySelector(".leftpupil, .rightpupil");
            const eyeRect = eye.getBoundingClientRect();

            const eyeCenterX = eyeRect.left + eyeRect.width / 2;
            const eyeCenterY = eyeRect.top + eyeRect.height / 2;

            const mouseX = event.clientX - eyeCenterX;
            const mouseY = event.clientY - eyeCenterY;

            const angle = Math.atan2(mouseY, mouseX);

            const maxMove = 50;

            const pupilX = Math.cos(angle) * maxMove;
            const pupilY = Math.sin(angle) * maxMove;

            pupil.style.transform = `translate(${pupilX - 8}px, ${pupilY - 11}px)`;
        });
    });
    </script>
